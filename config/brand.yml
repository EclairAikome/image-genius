# === Ajinomoto SG — Multi-Channel Brand Configuration ===

brand:
  name: "Ajinomoto"

# Global defaults (overridden per channel where specified)
defaults:
  image:
    model: "gpt-image-2"
    size: "1088x1360"          # 4:5 vertical portrait — closest divisible-by-16 size to IG's ideal 1080x1350 (OpenAI requires multiples of 16). IG auto-downscales on upload.
    quality: "high"
  output:
    directory: "output"
    format: "png"
  style:
    avoid_elements:
      - text or typography of any kind
      - watermarks
      - logos or brand marks
      - human faces (unless explicitly requested)
      - cartoon or illustration style (unless explicitly requested)

# === Shared Asset Paths ===
assets:
  ajinomoto_logo: "assets/Ajinomoto_Group_Global_Brand_logo.png"
  aminovital_logo:
    # Two variants — the skill selects based on the generated scene's tone.
    # navy: navy-coloured glyphs for use on LIGHT backgrounds
    # white: white glyphs for use on DARK backgrounds
    navy: "assets/AV Logo/AV LOGO.PNG"
    white: "assets/AV Logo/AV LOGO White.png"
  logo_position_reference_dir: "assets/Logo_Position_Size_Reference"

# === Channels ===

channels:
  dryfoods:
    instagram_handle: "@ajinomotosg_dryfoods"
    description: "Seasonings and Blendy coffee"
    product_pictures_dir: "assets/Dry Food"
    keywords:
      - seasoning
      - sauce
      - umami
      - Blendy
      - coffee
      - dry food
      - powder
      - stock
      - broth
      - MSG
    style:
      primary_colors: []       # TBD
      photography_style: "professional food photography, editorial quality"
      mood: "warm, homey, appetizing, comforting"
      recurring_elements: []
    logo:
      # Default pipeline: this file is passed as a REFERENCE IMAGE to openai.images.edit;
      # the prompt embeds a placement description derived from the SKU's logo_references.
      # position/width/opacity below are ONLY used by the manual `add-logo.mjs` fallback.
      file: "assets/Ajinomoto_Group_Global_Brand_logo.png"
      position: { x: 50, y: 50 }
      width: 160
      opacity: 1.0
    # SKU catalog — folder under product_pictures_dir + reference images for logo placement
    skus:
      AJI-NO-MOTO:
        dir: "AJI-NO-MOTO(R)"
        aliases: [MSG, ajinomoto seasoning, umami seasoning, 味精, 味之素, monosodium glutamate]
        logo_references: ["19 Jun MSG.png"]
      AJI-SHIO:
        dir: "AJI-SHIO(R)"
        aliases: [AJISHIO, garlic salt, seasoned salt, 味盐]
        logo_references: ["24 Jun AJISHIO.png"]
      Blendy:
        dir: "Blendy"
        aliases: [coffee, latte, mocha, instant coffee, 咖啡]
        # Note: logo_references resolve under assets/Logo_Position_Size_Reference/ by default,
        # OR can be absolute/relative paths starting with "assets/" to point elsewhere.
        logo_references:
          - "assets/Dry Food/Blendy/22 May Post.png"   # real past post in product folder
      HONDASHI:
        dir: "HONDASHI"
        aliases: [hondashi, hon-dashi, dashi, bonito stock, 鲣鱼粉, 木鱼花]
        logo_references: ["12 Jun Hondashi.png"]
      Mayonnaise:
        dir: "Mayonnaise"
        aliases: [mayo, mayonnaise, japanese mayo, 蛋黄酱]
        logo_references: ["10 Jun Mayo.png"]
      SERI-AJI:
        dir: "SERI-AJI(R)"
        aliases: [seri-aji, seriaji, all-in-one seasoning, ayam, kampung, ikan bilis, cina]
        logo_references:
          - "4 Jun Seri Ayam.png"
          - "4 Jun Seri Cina.png"
          - "4 Jun Seri IkanBilis.png"
          - "4 Jun Seri Kampung.png"
      TUMIX:
        dir: "TUMIX(R)"
        aliases: [tumix, soup base, soup mix, 高汤]
        logo_references: ["2 Jun Tumix.png"]

  frozen:
    instagram_handle: "@ajinomotosgfrozenfoods"
    description: "Frozen food products"
    product_pictures_dir: "assets/Frozen Food"   # to be created when product photos are available
    keywords:
      - frozen
      - gyoza
      - dumpling
      - edamame
      - takoyaki
      - fried rice
      - frozen food
    style:
      primary_colors: []       # TBD
      photography_style: "professional food photography, editorial quality"
      mood: "fresh, convenient, appetizing, family-friendly"
      recurring_elements: []
    logo:
      # Same pattern as dryfoods — reference-image in default pipeline; position/width
      # used only by manual `add-logo.mjs`.
      file: "assets/Ajinomoto_Group_Global_Brand_logo.png"
      position: { x: 50, y: 50 }
      width: 160
      opacity: 1.0
    skus: {}   # to be populated as frozen SKUs are added

  aminovital:
    instagram_handle: "@aminovital_sg"
    description: "AminoVITAL sports supplements"
    product_pictures_dir: "assets/AV Product Picture"
    keywords:
      - AminoVITAL
      - amino
      - BCAA
      - sports
      - supplement
      - protein
      - workout
      - exercise
      - recovery
      - electrolyte
    style:
      primary_colors:
        - "#071D49"            # Navy Blue
        - "#D4A84E"            # Warm Metallic Gold
      photography_style: "dynamic sports and lifestyle photography, premium editorial quality"
      mood: "energetic, professional, premium, performance-driven"
      recurring_elements:
        - navy blue and gold color accents
        - clean modern aesthetic
        - athletic/active lifestyle context
    # Logo: position/size derived from past Instagram posts in `logo_references` below.
    # The skill (or CLI prompt engine) inspects these reference images visually to
    # derive a one-sentence placement description that goes into the image prompt.
    # No Ajinomoto logo on AminoVITAL content.
    logo_references: []        # TBD — drop past AV posts into assets/AV_Logo_Position_Reference/ and list them here
    logo:
      file: "assets/AV Logo/AV LOGO.PNG"
      position: { x: 50, y: 50 }
      width: 180
      opacity: 1.0
    skus:
      BCAA-Jelly:
        dir: "BCAA Jelly"
        aliases: [BCAA, BCAA jelly, jelly, amino jelly]
      GOLD:
        dir: "GOLD"
        aliases: [gold, AV gold, premium]
      PRO:
        dir: "PRO"
        aliases: [pro, AV pro]
      Perfect-Energy:
        dir: "Perfect Energy"
        aliases: [perfect energy, energy gel, energy]
      amino-protein:
        dir: "amino protein"
        aliases: [amino protein, protein, protein powder]
      aminoshot:
        dir: "aminoshot"
        aliases: [aminoshot, amino shot, shot]
